<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pipetta">
<meta name="theme-color" content="#070A2B">
<style>:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>Pipetta</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=DM+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: one fixed screen. Slim header (wordmark, level stepper, move count), the rack of tubes fills the middle, three thumb-reach actions at the bottom. */
:root {
  --bg: #070A2B;
  --glow: #1A2472;
  --dot: #2A3384;
  --panel: #141A56;
  --ink: #EEF1FF;
  --muted: #9AA4DA;
  --rim: #6E9DEB;
  --glass: rgba(9, 12, 46, .7);
  --shine: rgba(255, 255, 255, .16);
  --hatch-a: #262E72;
  --hatch-b: #323B88;
  --seal-a: #1D3767;
  --seal-b: #26467F;
  --on-ink: #0B0F3A;
  --scrim: rgba(3, 5, 25, .72);
  --display: "Unbounded", "Avenir Next", "Segoe UI", sans-serif;
  --body: "DM Sans", -apple-system, "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}

html, body { height: 100%; }
body {
  background:
    radial-gradient(var(--dot) 1px, transparent 1.4px) 11px 7px / 97px 131px,
    radial-gradient(var(--dot) 1.3px, transparent 1.7px) 53px 71px / 149px 113px,
    radial-gradient(120% 55% at 50% 100%, var(--glow), transparent 70%),
    var(--bg);
  color: var(--ink);
  font-family: var(--body);
  display: flex; flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px 14px;
  box-sizing: border-box;
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
  touch-action: manipulation;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; touch-action: manipulation; }
button:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

/* header */
.top { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; flex: none; }
.brand { font-family: var(--display); font-weight: 700; font-size: 15px; letter-spacing: -.01em; }
.stepper { display: flex; align-items: center; gap: 4px; }
.stepper button { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; }
.stepper button:disabled { opacity: .25; cursor: default; }
.stepper svg { width: 18px; height: 18px; }
.lvl { text-align: center; min-width: 76px; }
.lvl small { display: block; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.lvl b { font-family: var(--display); font-size: 26px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.moves { justify-self: end; text-align: right; font-size: 12px; color: var(--muted); font-weight: 500; }
.moves b { display: block; color: var(--ink); font-family: var(--display); font-size: 15px; font-weight: 500; font-variant-numeric: tabular-nums; }

.tiers { flex: none; display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; margin-top: 10px; }
.tiers button { height: 36px; border-radius: 99px; font-size: 11.5px; font-weight: 700; color: var(--muted); box-shadow: inset 0 0 0 1.5px var(--hatch-b); }
.tiers button[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); box-shadow: none; }
.note { flex: none; min-height: 20px; margin-top: 6px; text-align: center; font-size: 13px; color: var(--muted); font-weight: 500; }

/* rack */
.board { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; gap: var(--rg, 34px); }
.row { display: flex; justify-content: center; gap: var(--cg, 14px); }
.slot { width: var(--tw); height: var(--th); flex: none; }
.tube {
  position: relative; display: block; width: var(--tw); height: var(--th);
  transform-origin: 50% 0;
  transition: transform .18s cubic-bezier(.3, .7, .3, 1);
}
.tube::before { /* rim of the neck */
  content: ""; position: absolute; z-index: 2; top: 0; left: 19%; right: 19%; height: 7px;
  background: var(--rim); border-radius: 4px;
}
.neck {
  position: absolute; top: 4px; left: 26%; right: 26%; height: 13%; box-sizing: border-box;
  border: 2.5px solid var(--rim); border-block: 0; background: var(--glass);
}
.glass {
  position: absolute; inset: 12% 0 0; box-sizing: border-box;
  border: 2.5px solid var(--rim);
  border-radius: calc(var(--tw) * .34) calc(var(--tw) * .34) calc(var(--tw) * .3) calc(var(--tw) * .3);
  background: var(--glass); overflow: hidden;
  box-shadow: 0 0 14px rgba(110, 157, 235, .22);
}
.glass::after { /* highlight */
  content: ""; position: absolute; z-index: 3; top: 9%; bottom: 14%; left: 12%; width: 13%;
  border-radius: 99px; background: linear-gradient(var(--shine), transparent); pointer-events: none;
}
.liq { position: absolute; inset: 14% 0 0; display: flex; flex-direction: column-reverse; }
.unit { position: relative; flex: none; height: var(--uh, 25%); background: linear-gradient(90deg, color-mix(in srgb, var(--c), #000 22%), var(--c) 30%, var(--c) 70%, color-mix(in srgb, var(--c), #000 28%)); }
.unit:last-child::before { /* surface of the topmost layer */
  content: ""; position: absolute; left: 0; right: 0; top: calc(var(--tw) * -.09); height: calc(var(--tw) * .18);
  border-radius: 50%; background: color-mix(in srgb, var(--c), #fff 32%);
}
.unit.grow { animation: grow .22s linear both; }
.unit.shrink { animation: grow .22s linear reverse both; }
@keyframes grow { from { height: 0; } to { height: var(--uh, 25%); } }
.unit.hid {
  background: repeating-linear-gradient(135deg, var(--hatch-a) 0 6px, var(--hatch-b) 6px 12px);
  display: grid; place-items: center;
  box-shadow: inset 0 2px 0 var(--bg);
}
.unit.hid:last-child::before { background: var(--hatch-b); }
.unit.hid::after { content: "?"; font-family: var(--display); font-weight: 700; font-size: calc(var(--tw) * .34); color: var(--ink); opacity: .7; position: relative; }
.stream { position: absolute; z-index: 1; top: 0; left: 50%; width: 7px; margin-left: -3.5px; border-radius: 0 0 4px 4px; background: var(--c); height: 0; }

.tube.sel { transform: translateY(-16px); }
.tube.pour { z-index: 5; transition: transform .2s cubic-bezier(.4, 0, .2, 1); }
.tube.done::after { /* stopper */
  content: ""; position: absolute; z-index: 4; left: 50%; top: -9px; width: 44%; height: 15px; margin-left: -22%;
  background: var(--ink); border-radius: 5px 5px 2px 2px;
  animation: plug .3s cubic-bezier(.3, 1.6, .5, 1) both;
}
@keyframes plug { from { transform: translateY(-14px); opacity: 0; } }

/* sealed tube: contents covered until enough tubes are finished */
.seal {
  position: absolute; inset: 0; z-index: 4; display: grid; place-items: center;
  background: repeating-linear-gradient(45deg, var(--seal-a) 0 9px, var(--seal-b) 9px 18px);
}
.seal span {
  width: 74%; aspect-ratio: 1; border-radius: 50%; background: var(--panel); color: var(--ink);
  display: grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: calc(var(--tw) * .36);
  box-shadow: 0 0 0 3px var(--rim);
}
.tube.shake { animation: shake .3s; }
@keyframes shake { 25% { transform: translateX(-5px); } 50% { transform: translateX(5px); } 75% { transform: translateX(-3px); } }
.tube.hint .glass { animation: hint 1s ease-in-out infinite; }
@keyframes hint { 50% { box-shadow: 0 0 0 6px var(--ink), 0 0 24px var(--ink); } }

/* actions */
.actions { flex: none; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.actions button {
  height: 52px; border-radius: 16px; background: var(--panel); box-shadow: inset 0 0 0 2px var(--rim);
  display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 700; font-size: 14px;
}
.actions button:active { transform: translateY(1px); }
.actions button:disabled { opacity: .35; cursor: default; }
.actions svg { width: 18px; height: 18px; flex: none; }

/* win sheet */
.win { position: fixed; inset: 0; z-index: 20; background: var(--scrim); display: grid; place-items: end center; }
.sheet {
  width: 100%; max-width: 460px; box-sizing: border-box; background: var(--panel); border-radius: 28px 28px 0 0;
  padding: 28px max(24px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(24px, env(safe-area-inset-left, 0px));
  text-align: center; animation: up .35s cubic-bezier(.2, .9, .3, 1) both;
}
@keyframes up { from { transform: translateY(100%); } }
.sheet h2 { font-family: var(--display); font-weight: 700; font-size: 30px; margin: 0 0 6px; letter-spacing: -.02em; text-wrap: balance; }
.sheet p { margin: 0 0 22px; color: var(--muted); font-size: 15px; }
.sheet button { width: 100%; height: 56px; border-radius: 18px; background: var(--ink); color: var(--on-ink); font-weight: 700; font-size: 16px; }
.swatches { display: flex; justify-content: center; gap: 6px; margin-bottom: 18px; }
.swatches i { width: 14px; height: 30px; border-radius: 0 0 7px 7px; background: var(--c); }

/* ---------- Labor: experiments ---------- */
.board { position: relative; isolation: isolate; }
.face { position: absolute; inset: 0; z-index: 1; display: flex; align-items: center; justify-content: center; gap: calc(var(--tw) * .07); pointer-events: none; transform: translateY(-14%); }
.eye { position: relative; width: calc(var(--tw) * .25); aspect-ratio: 1; border-radius: 50%; background: #fff; box-shadow: 0 0 0 1.5px #10122e; animation: blink 4.5s var(--bd, 0s) infinite; }
.eye i { position: absolute; left: 26%; top: 26%; width: 48%; height: 48%; border-radius: 50%; background: #10122e; transform: translate(var(--lx, 0px), var(--ly, 0px)); transition: transform .18s; }
.mouth { position: absolute; left: 50%; top: 68%; width: calc(var(--tw) * .2); height: calc(var(--tw) * .09); margin-left: calc(var(--tw) * -.1); box-sizing: border-box; border: 2px solid #10122e; border-top: 0; border-radius: 0 0 99px 99px; transition: all .15s; }
.tube.done .mouth { height: calc(var(--tw) * .15); background: #10122e; }
.tube.sel .mouth, .tube.pour .mouth { width: calc(var(--tw) * .12); height: calc(var(--tw) * .12); margin-left: calc(var(--tw) * -.06); border-top: 2px solid #10122e; border-radius: 50%; }
.tube.sel .eye, .tube.pour .eye { transform: scale(1.15); animation: none; }
@keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.08); } }

.fx-flip .slot { transform: scaleY(-1); }
.fx-flip .unit.hid::after, .fx-flip .seal span { transform: scaleY(-1); }

.fx-disco::before {
  content: ""; position: absolute; z-index: -1; left: 50%; top: 50%; width: 150vmax; height: 150vmax; margin: -75vmax;
  background: repeating-conic-gradient(from 0deg, #ff4fa3 0 8deg, transparent 8deg 30deg, #3ad6ff 30deg 38deg, transparent 38deg 60deg, #ffd23a 60deg 68deg, transparent 68deg 90deg);
  opacity: .16; animation: spin 14s linear infinite; pointer-events: none;
  -webkit-mask: radial-gradient(closest-side, #000 20%, transparent 70%); mask: radial-gradient(closest-side, #000 20%, transparent 70%);
}
@keyframes spin { to { transform: rotate(360deg); } }
.fx-disco .slot { animation: bop .6s var(--sd, 0s) ease-in-out infinite alternate; }
@keyframes bop { to { transform: translateY(-7px) rotate(var(--sr, 2deg)); } }
.fx-disco .glass { animation: neon 1.8s var(--sd, 0s) linear infinite; }
@keyframes neon {
  0%, 100% { box-shadow: 0 0 16px #ff4fa3; border-color: #ff8cc4; }
  33% { box-shadow: 0 0 16px #3ad6ff; border-color: #8ce6ff; }
  66% { box-shadow: 0 0 16px #ffd23a; border-color: #ffe48a; }
}
.fx-bubbles .unit:not(.hid)::after {
  content: ""; position: absolute; inset: 0;
  background: radial-gradient(rgba(255, 255, 255, .55) 1.6px, transparent 2.2px) 3px 0 / 17px 23px, radial-gradient(rgba(255, 255, 255, .4) 1.1px, transparent 1.7px) 11px 9px / 13px 19px;
  animation: fizz 1.6s linear infinite;
}
@keyframes fizz { to { background-position: 3px -23px, 11px -10px; } }

@media (prefers-reduced-motion: reduce) {
  .fx-disco::before, .fx-disco .slot, .fx-disco .glass, .fx-bubbles .unit::after, .eye { animation: none !important; }
  .tube, .tube.pour { transition-duration: .01s; }
  .unit.grow, .unit.shrink, .tube.done::after, .sheet, .tube.hint .glass { animation-duration: .01s; }
}
</style>

<header class="top">
  <div class="brand">Pipetta</div>
  <div class="stepper">
    <button id="prev" type="button" aria-label="Vorheriges Level"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="lvl"><small>Level</small><b id="lvl">1</b></div>
    <button id="next" type="button" aria-label="Nächstes Level"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>
  <div class="moves">Züge<b id="moves">0</b></div>
</header>
<div class="tiers" id="tiers" role="group" aria-label="Schwierigkeit">
  <button type="button" data-d="easy">Leicht</button>
  <button type="button" data-d="medium">Mittel</button>
  <button type="button" data-d="hard">Schwer</button>
  <button type="button" data-d="expert">Experte</button>
  <button type="button" data-d="lab">Labor</button>
</div>
<div class="note" id="note" aria-live="polite"></div>

<main class="board" id="board"></main>

<nav class="actions">
  <button id="undo" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 7L4 12l5 5"/><path d="M4 12h10a6 6 0 010 12"/></svg>Zurück</button>
  <button id="restart" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 11-2.6-5.9"/><path d="M20 4v5h-5"/></svg>Neu</button>
  <button id="hint" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 00-3.5 10.9V15h7v-1.1A6 6 0 0012 3z"/></svg>Tipp</button>
</nav>

<div class="win" id="win" hidden>
  <div class="sheet">
    <div class="swatches" id="swatches"></div>
    <h2>Alles sortiert</h2>
    <p id="winText"></p>
    <button id="nextLevel" type="button">Weiter zu Level 2</button>
  </div>
</div>

<script>
(() => {
'use strict';
let CAP = 4;
const COLORS = ['#E5484D', '#F2913D', '#F4CF3A', '#3FAE6A', '#22B8C4', '#3B6FE0', '#8A55D8', '#EE6FB3', '#8B5E3C', '#A6D84A', '#C9D1DC', '#12766C'];
const $ = id => document.getElementById(id);
const board = $('board');

/* ---------- rules shared by game and solver ---------- */
const isFull = a => a.length === CAP && a.every(c => c === a[0]);
function doneCount(tubes, thr) {
  let cnt = 0;
  for (let i = 0; i < tubes.length; i++) if (!thr[i] && isFull(tubes[i])) cnt++;
  for (;;) {
    let c2 = 0;
    for (let i = 0; i < tubes.length; i++) if (thr[i] <= cnt && isFull(tubes[i])) c2++;
    if (c2 === cnt) return cnt;
    cnt = c2;
  }
}
function runLen(a) { let r = 1; while (r < a.length && a[a.length - 1 - r] === a[a.length - 1]) r++; return r; }

function solve(start, thr, limit) {
  const t = start.map(a => a.slice()), n = t.length, seen = new Set(), path = [];
  let nodes = 0;
  function rec() {
    const dc = doneCount(t, thr);
    let solved = true;
    for (let i = 0; i < n; i++) if (t[i].length && !isFull(t[i])) { solved = false; break; }
    if (solved) return true;
    if (++nodes > limit) return false;
    const key = t.map((a, i) => (thr[i] > dc ? 'L' + thr[i] + ':' : '') + a.join('')).sort().join('|');
    if (seen.has(key)) return false;
    seen.add(key);
    const mv = [];
    for (let a = 0; a < n; a++) {
      const A = t[a];
      if (thr[a] > dc || !A.length || isFull(A)) continue;
      const c = A[A.length - 1], r = runLen(A);
      let usedEmpty = false;
      for (let b = 0; b < n; b++) {
        const B = t[b];
        if (b === a || thr[b] > dc || B.length === CAP) continue;
        if (!B.length) { if (r === A.length || usedEmpty) continue; usedEmpty = true; mv.push([a, b, 2]); }
        else if (B[B.length - 1] === c) mv.push([a, b, r <= CAP - B.length ? 0 : 1]);
      }
    }
    mv.sort((x, y) => x[2] - y[2]);
    for (const [a, b] of mv) {
      const k = Math.min(runLen(t[a]), CAP - t[b].length);
      for (let i = 0; i < k; i++) t[b].push(t[a].pop());
      path.push([a, b]);
      if (rec()) return true;
      path.pop();
      for (let i = 0; i < k; i++) t[a].push(t[b].pop());
      if (nodes > limit) return false;
    }
    return false;
  }
  if (!rec()) return null;
  const out = path.slice(); out.nodes = nodes; return out;
}

/* ---------- level generator (same level number, same puzzle) ---------- */
function rng(a) {
  return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
/* Four tiers. Each tier ramps its colour count over the first levels, then stays there.
   pick: of several solvable shuffles keep the one the solver finds easiest (-1), the first (0) or the toughest (1). */
const TIERS = {
  easy:   { name: 'Leicht',  id: 1, pick: -1, spec: L => ({ colors: 3 + Math.min(2, Math.floor((L - 1) / 2)), hidden: false, locks: 0 }) },
  medium: { name: 'Mittel',  id: 2, pick: 0,  spec: L => ({ colors: 5 + Math.min(2, Math.floor((L - 1) / 3)), hidden: L % 2 === 0, locks: L % 3 === 0 ? 1 : 0 }) },
  hard:   { name: 'Schwer',  id: 3, pick: 1,  spec: L => ({ colors: 7 + Math.min(2, Math.floor((L - 1) / 3)), hidden: L % 3 !== 0, locks: L % 2 === 0 ? 2 : 1 }) },
  expert: { name: 'Experte', id: 4, pick: 1,  spec: L => ({ colors: 10 + Math.min(2, Math.floor((L - 1) / 3)), hidden: true, locks: L % 2 === 0 ? 3 : 2 }) },
  lab:    { name: 'Labor',   id: 5, pick: 0,  spec: L => {
    const up = Math.min(2, Math.floor((L - 1) / 5));
    return [
      { title: 'Glubschaugen: Die Farben schauen dir beim Sortieren zu.', colors: 5 + up, fx: ['eyes'] },
      { title: 'Riesenflaschen: Hier passen sechs Schichten hinein.', colors: 4 + up, cap: 6, fx: ['eyes'] },
      { title: 'Kopfstand: Heute hängt alles von der Decke.', colors: 6 + up, fx: ['eyes', 'flip'] },
      { title: 'Zwergenparade: Viele Farben, nur drei Schichten pro Flasche.', colors: 9 + Math.min(1, up), cap: 3, fx: ['eyes'] },
      { title: 'Disco: Es sprudelt, blinkt und wackelt.', colors: 7 + Math.min(1, up), hidden: true, locks: 1, fx: ['eyes', 'disco', 'bubbles'] }
    ][(L - 1) % 5];
  } }
};
function makeLevel(d, L) {
  const T = TIERS[d], s = T.spec(L), want = T.pick ? 4 : 1, found = [];
  CAP = s.cap || 4;
  for (let attempt = 0; found.length < want; attempt++) {
    const r = rng(T.id * 1000003 + L * 7919 + attempt * 104729);
    const locks = Math.max(0, (s.locks || 0) - Math.floor(attempt / 20));
    const units = [];
    for (let c = 0; c < s.colors; c++) for (let i = 0; i < CAP; i++) units.push(c);
    for (let i = units.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [units[i], units[j]] = [units[j], units[i]]; }
    const tubes = [], thr = [];
    for (let c = 0; c < s.colors; c++) { tubes.push(units.slice(c * CAP, c * CAP + CAP)); thr.push(0); }
    tubes.push([], []); thr.push(0, 0);
    const picked = new Set();
    while (picked.size < locks) picked.add(Math.floor(r() * s.colors));
    let k = 1; for (const i of picked) thr[i] = k++;
    if (tubes.some(isFull)) continue;
    const path = solve(tubes, thr, 40000);
    if (!path) continue;
    found.push({ tubes, thr, hidden: !!s.hidden, effort: path.nodes, cap: CAP, fx: s.fx || [], title: s.title || '' });
  }
  found.sort((x, y) => (x.effort - y.effort) * (T.pick || 1));
  return T.pick > 0 ? found[found.length - 1] : found[0];
}

/* ---------- game state ---------- */
const store = {
  get() { try { return JSON.parse(localStorage.getItem('pipetta') || '{}'); } catch (e) { return {}; } },
  set(v) { try { localStorage.setItem('pipetta', JSON.stringify(v)); } catch (e) {} }
};
let S = null;          // { level, tubes:[{u:[{c,h}], thr}], moves, hist:[] }
let diff = 'easy', prog = { easy: 1, medium: 1, hard: 1, expert: 1, lab: 1 }, sel = -1, busy = false, hintT = 0;

const cols = t => t.u.map(x => x.c);
const allCols = () => S.tubes.map(cols);
const allThr = () => S.tubes.map(t => t.thr);
const done = () => doneCount(allCols(), allThr());
const locked = (t, dc) => t.thr > dc;

function reveal() {
  const dc = done();
  for (const t of S.tubes) {
    if (locked(t, dc) || !t.u.length) continue;
    const top = t.u[t.u.length - 1].c;
    for (let i = t.u.length - 1; i >= 0 && t.u[i].c === top; i--) t.u[i].h = false;
  }
}
function load(L, saved) {
  if (saved) { S = saved; CAP = S.cap || 4; }
  else {
    const lv = makeLevel(diff, L);
    S = { diff, level: L, cap: lv.cap, fx: lv.fx, title: lv.title, moves: 0, hist: [], tubes: lv.tubes.map((a, i) => ({ thr: lv.thr[i], u: a.map(c => ({ c, h: lv.hidden })) })) };
    reveal();
  }
  sel = -1; busy = false;
  $('win').hidden = true;
  layout(); render(); persist();
}
function persist() { saves[diff] = S; store.set({ v: 2, diff, prog, saves }); }
let saves = {};

/* ---------- rendering ---------- */
function layout() {
  const n = S.tubes.length, rows = Math.ceil(n / 5), per = Math.ceil(n / rows), fx = S.fx || [];
  board.className = 'board' + fx.map(f => ' fx-' + f).join('');
  board.style.setProperty('--uh', 100 / CAP + '%');
  const W = board.clientWidth, H = board.clientHeight;
  const cg = 16, rg = 38;
  const tw = Math.floor(Math.min(58, (W - cg * (per - 1) - 10) / per));
  let th = Math.floor(Math.min(tw * (CAP === 6 ? 4.3 : CAP === 3 ? 2.8 : 3.3), (H - rg * (rows - 1) - 50) / rows));
  board.style.setProperty('--tw', tw + 'px');
  board.style.setProperty('--th', th + 'px');
  board.style.setProperty('--cg', cg + 'px');
  board.style.setProperty('--rg', rg + 'px');
  board.innerHTML = '';
  for (let r = 0; r < rows; r++) {
    const row = document.createElement('div'); row.className = 'row';
    for (let i = r * per; i < Math.min(n, (r + 1) * per); i++) {
      const slot = document.createElement('div'); slot.className = 'slot';
      slot.style.setProperty('--sd', (-(i * 0.37) % 1.8) + 's'); slot.style.setProperty('--sr', (i % 2 ? 2.5 : -2.5) + 'deg');
      slot.innerHTML = '<button type="button" class="tube" data-i="' + i + '"><span class="neck"></span><span class="glass"><span class="liq"></span><span class="stream"></span></span></button>';
      row.appendChild(slot);
    }
    board.appendChild(row);
  }
}
const tubeEl = i => board.querySelector('.tube[data-i="' + i + '"]');
function unitEl(x, face) {
  const d = document.createElement('span');
  d.className = 'unit' + (x.h ? ' hid' : '');
  d.style.setProperty('--c', COLORS[x.c]);
  if (face) { d.innerHTML = '<i class="face"><i class="eye"><i></i></i><i class="eye"><i></i></i><i class="mouth"></i></i>'; d.style.setProperty('--bd', -((x.c * 1.3) % 4.5) + 's'); }
  return d;
}
function lookAt() {
  const flip = (S.fx || []).includes('flip');
  S.tubes.forEach((t, i) => {
    const el = tubeEl(i);
    if (sel < 0 || sel === i) { el.style.removeProperty('--lx'); el.style.removeProperty('--ly'); return; }
    const a = el.parentNode.getBoundingClientRect(), b = tubeEl(sel).parentNode.getBoundingClientRect();
    const dx = b.left - a.left, dy = b.top - a.top, d = Math.hypot(dx, dy) || 1, r = a.width * .045;
    el.style.setProperty('--lx', (dx / d * r).toFixed(1) + 'px');
    el.style.setProperty('--ly', ((flip ? -dy : dy) / d * r).toFixed(1) + 'px');
  });
}
function render() {
  const dc = done(), eyes = (S.fx || []).includes('eyes');
  S.tubes.forEach((t, i) => {
    const el = tubeEl(i), glass = el.querySelector('.glass'), liq = glass.firstChild;
    const lk = locked(t, dc);
    liq.replaceChildren(...t.u.map((x, j) => unitEl(x, eyes && !lk && !x.h && (j === t.u.length - 1 || t.u[j + 1].c !== x.c))));
    let seal = glass.querySelector('.seal');
    if (lk && !seal) { seal = document.createElement('span'); seal.className = 'seal'; seal.innerHTML = '<span></span>'; glass.appendChild(seal); }
    if (!lk && seal) seal.remove();
    if (lk) seal.firstChild.textContent = t.thr - dc;
    el.className = 'tube' + (i === sel ? ' sel' : '') + (!lk && isFull(cols(t)) ? ' done' : '');
    el.style.transform = '';
    el.setAttribute('aria-label', 'Röhrchen ' + (i + 1) + (lk ? ', versiegelt' : ''));
  });
  $('lvl').textContent = S.level;
  $('moves').textContent = S.moves;
  $('prev').disabled = S.level <= 1;
  $('next').disabled = S.level >= prog[diff];
  document.querySelectorAll('#tiers button').forEach(b => b.setAttribute('aria-pressed', b.dataset.d === diff));
  $('undo').disabled = !S.hist.length;
  const anyLock = S.tubes.some(t => locked(t, dc));
  const anyHid = S.tubes.some(t => t.u.some(x => x.h));
  lookAt();
  if (!noteT) $('note').textContent = S.title ? S.title : anyLock ? 'Versiegelte Röhrchen öffnen sich nach so vielen fertigen Farben.'
    : anyHid ? 'Verdeckte Schichten zeigen sich, sobald sie oben liegen.'
    : diff === 'easy' && S.level === 1 && !S.moves ? 'Tippe ein Röhrchen an, dann das Ziel.' : '';
}
let noteT = 0;
function say(msg) {
  $('note').textContent = msg;
  clearTimeout(noteT);
  noteT = setTimeout(() => { noteT = 0; render(); }, 2600);
}
function clearHint() { clearTimeout(hintT); board.querySelectorAll('.hint').forEach(e => e.classList.remove('hint')); }

/* ---------- moves ---------- */
function canPour(a, b) {
  const dc = done(), A = S.tubes[a], B = S.tubes[b];
  if (a === b || locked(A, dc) || locked(B, dc) || !A.u.length || B.u.length === CAP) return 0;
  const ca = cols(A);
  if (isFull(ca)) return 0;
  if (B.u.length && B.u[B.u.length - 1].c !== ca[ca.length - 1]) return 0;
  return Math.min(runLen(ca), CAP - B.u.length);
}
function shake(i) { const el = tubeEl(i); el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }

function tap(i) {
  if (busy) return;
  clearHint();
  const dc = done(), t = S.tubes[i];
  if (sel < 0) {
    if (locked(t, dc)) { shake(i); say('Noch ' + (t.thr - dc) + ' fertige Farbe' + (t.thr - dc > 1 ? 'n' : '') + ', dann öffnet es sich.'); return; }
    if (!t.u.length || isFull(cols(t))) return;
    sel = i; tubeEl(i).classList.add('sel'); lookAt();
    return;
  }
  if (i === sel) { sel = -1; tubeEl(i).classList.remove('sel'); lookAt(); return; }
  const k = canPour(sel, i);
  if (!k) {
    shake(i);
    tubeEl(sel).classList.remove('sel'); sel = -1;
    if (!locked(t, dc) && t.u.length && !isFull(cols(t))) { sel = i; tubeEl(i).classList.add('sel'); }
    lookAt();
    return;
  }
  pour(sel, i, k);
}

function pour(a, b, k) {
  busy = true; sel = -1;
  S.hist.push(JSON.stringify(S.tubes));
  if (S.hist.length > 300) S.hist.shift();
  const A = S.tubes[a], B = S.tubes[b], color = COLORS[A.u[A.u.length - 1].c];
  const before = B.u.length;
  for (let i = 0; i < k; i++) B.u.push(A.u.pop());
  S.moves++;
  reveal(); persist();

  const src = tubeEl(a), dst = tubeEl(b);
  const sr = src.parentNode.getBoundingClientRect(), dr = dst.parentNode.getBoundingClientRect(), br = board.getBoundingClientRect();
  const tw = sr.width, dir = (dr.left + tw / 2) > (br.left + br.width / 2) ? 1 : -1;
  const flip = (S.fx || []).includes('flip');
  const dx = dr.left - sr.left + dir * tw * .1, dy = (flip ? sr.top - dr.top : dr.top - sr.top) - tw * .5 - 12;
  src.classList.remove('sel'); src.classList.add('pour');
  src.style.transform = 'translate(' + dx + 'px,' + dy + 'px) rotate(' + dir * 100 + 'deg)';

  setTimeout(() => {
    const sUnits = src.querySelectorAll('.unit'), dLiq = dst.querySelector('.liq'), stream = dst.querySelector('.stream');
    for (let i = 0; i < k; i++) sUnits[sUnits.length - 1 - i].classList.add('shrink');
    for (let i = 0; i < k; i++) { const u = unitEl({ c: 0, h: false }); u.style.setProperty('--c', color); u.classList.add('grow'); dLiq.appendChild(u); }
    stream.style.setProperty('--c', color);
    stream.style.height = (100 - before * 100 / CAP) + '%';
    setTimeout(() => {
      stream.style.height = '0';
      src.style.transform = '';
      setTimeout(() => { busy = false; render(); checkWin(); }, 190);
    }, 230);
  }, 200);
}

function checkWin() {
  if (!S.tubes.every(t => !t.u.length || isFull(cols(t)))) return;
  if (S.level >= prog[diff]) prog[diff] = S.level + 1;
  S.hist = []; persist();
  $('swatches').innerHTML = S.tubes.filter(t => t.u.length).map(t => '<i style="--c:' + COLORS[t.u[0].c] + '"></i>').join('');
  $('winText').textContent = TIERS[diff].name + ', Level ' + S.level + ' in ' + S.moves + ' Zügen gelöst.';
  $('nextLevel').textContent = 'Weiter zu Level ' + (S.level + 1);
  $('win').hidden = false;
}

/* ---------- controls ---------- */
board.addEventListener('click', e => { const t = e.target.closest('.tube'); if (t) tap(+t.dataset.i); });
$('undo').onclick = () => {
  if (busy || !S.hist.length) return;
  clearHint();
  S.tubes = JSON.parse(S.hist.pop()); S.moves++; sel = -1;
  render(); persist();
};
$('restart').onclick = () => { if (!busy) { clearHint(); load(S.level); } };
$('hint').onclick = () => {
  if (busy) return;
  clearHint();
  const path = solve(allCols(), allThr(), 150000);
  if (!path || !path.length) { say('Von hier geht es nicht weiter. Nimm Züge zurück oder starte neu.'); return; }
  if (sel >= 0) { tubeEl(sel).classList.remove('sel'); sel = -1; }
  tubeEl(path[0][0]).classList.add('hint'); tubeEl(path[0][1]).classList.add('hint');
  say('Gieße das eine markierte Röhrchen in das andere.');
  hintT = setTimeout(clearHint, 4000);
};
$('prev').onclick = () => { if (!busy && S.level > 1) load(S.level - 1); };
$('next').onclick = () => { if (!busy && S.level < prog[diff]) load(S.level + 1); };
const solvedNow = () => S.tubes.every(t => !t.u.length || isFull(cols(t)));
function setTier(d) {
  diff = d; clearHint();
  const sv = saves[d];
  if (sv && sv.tubes) { load(sv.level, sv); if (solvedNow()) load(prog[d]); }
  else load(prog[d]);
}
$('tiers').onclick = e => { const b = e.target.closest('button'); if (b && !busy && b.dataset.d !== diff) setTier(b.dataset.d); };
$('nextLevel').onclick = () => load(S.level + 1);
let rz = 0;
window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (!busy) { layout(); render(); } }, 120); });
document.addEventListener('gesturestart', e => e.preventDefault());

function start(data) {
  let saved = (data && data.v === 2) ? data : store.get();
  if (saved.v !== 2) saved = {};
  Object.assign(prog, saved.prog || {});
  saves = saved.saves || {};
  setTier(TIERS[saved.diff] ? saved.diff : 'easy');
}
const hot = window.claude && window.claude.hot;
if (hot && hot.snapshot) hot.snapshot(() => ({ v: 2, diff, prog, saves }));
if (hot && hot.ready) hot.ready(start); else start(hot && hot.data);
window.__pipetta = { solve, makeLevel, TIERS, tap, setTier, get S() { return S; }, load };
})();
</script>
</body>
</html>
